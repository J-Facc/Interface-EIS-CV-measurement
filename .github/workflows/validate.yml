name: Validate app

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile all sources
        run: python -m compileall app.py core fits circuit plotting exports ui pages
      - name: Run tests
        run: python -m pytest tests/ -v

  # Tests DRT RÉELS (AUDIT.md §8.3). Le job `validate` n'installe ni cvxopt ni CmdStan :
  # tests/test_drt.py::test_*optimize / *sample et les tests « DRT réelle » de
  # tests/test_pipeline.py y sont donc SAUTÉS. Ce job les exécute pour de vrai.
  drt:
    name: DRT réelle (cvxopt + CmdStan)
    runs-on: ubuntu-latest
    # HMC par défaut du moteur drt/ (4 chaînes × 2000 tirages) : ~2-5 min par spectre.
    timeout-minutes: 150
    env:
      CMDSTAN_VERSION: "2.36.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # Versions épinglées ICI parce que requirements-drt.txt ne l'est pas (>=).
          # Ce sont celles avec lesquelles la DRT a été mesurée (AUDIT.md §4.4, Annexe A).
          pip install cvxopt==1.3.3 cmdstanpy==1.3.0
      # CmdStan (téléchargement + compilation, plusieurs minutes) va dans ~/.cmdstan, où
      # cmdstanpy le retrouve seul. Seul CmdStan est mis en cache : les modèles Stan de
      # vendor/ (Series.stan) sont recompilés à chaque run, ~1-3 min.
      - name: Cache CmdStan
        id: cmdstan-cache
        uses: actions/cache@v4
        with:
          path: ~/.cmdstan
          key: cmdstan-${{ runner.os }}-${{ env.CMDSTAN_VERSION }}
      - name: Install CmdStan
        if: steps.cmdstan-cache.outputs.cache-hit != 'true'
        run: |
          python -c "import os, cmdstanpy; assert cmdstanpy.install_cmdstan(version=os.environ['CMDSTAN_VERSION'], cores=os.cpu_count() or 2, progress=False), 'install_cmdstan a échoué'"
      # Garde-fou : sans lui, une pile DRT absente ferait SAUTER tous les tests DRT et le
      # job resterait vert en ne vérifiant rien — exactement le défaut de la CI actuelle.
      - name: Check the DRT stack is really available
        run: |
          python -c "import fits.drt_fit as d; assert d.bayes_available(), d.import_error(); assert d.cmdstan_available(), 'CmdStan introuvable'; print('Pile DRT OK')"
          python -c "import drt.engine as e; ok, why = e.engine_available(); assert ok, why; print('Moteur drt/ OK')"
      # tests/test_drt_engine.py : moteur durci drt/ (HMC par défaut, ~2-5 min par spectre sur
      # 4 cœurs — les 7 cas DRT-1 + reproductibilité, marqués slow, sont exécutés ici).
      - name: Run DRT tests (MAP + HMC)
        run: python -m pytest tests/test_drt.py tests/test_pipeline.py tests/test_drt_engine.py -v -rs
