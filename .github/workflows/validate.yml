name: Validate app

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Compile all sources
        run: python -m compileall app.py setup_drt_bayesien.py core fits drt circuit plotting exports ui pages tests
      - name: Run tests
        run: python -m pytest tests/ -v

  # Tests DRT RÉELS. Le job `validate` n'installe ni cvxopt ni CmdStan :
  # les tests « DRT réelle » de tests/test_drt_engine.py, tests/test_drt_fitresult_contract.py et
  # tests/test_pipeline.py y sont donc SAUTÉS. Ce job les exécute pour de vrai.
  drt:
    name: DRT réelle (cvxopt + CmdStan)
    runs-on: ubuntu-latest
    # HMC par défaut du moteur drt/ (4 chaînes × 2000 tirages) : ~2-5 min par spectre.
    timeout-minutes: 150
    env:
      CMDSTAN_VERSION: "2.36.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt -r requirements-drt.txt
      # CmdStan (téléchargement + compilation, plusieurs minutes) va dans ~/.cmdstan, où
      # cmdstanpy le retrouve seul. Seul CmdStan est mis en cache : les modèles Stan de
      # drt/bayes_drt2 (Series.stan, Series_pos.stan) sont recompilés à chaque run, ~1-3 min.
      - name: Cache CmdStan
        id: cmdstan-cache
        uses: actions/cache@v4
        with:
          path: ~/.cmdstan
          key: cmdstan-${{ runner.os }}-${{ env.CMDSTAN_VERSION }}
      - name: Install CmdStan
        if: steps.cmdstan-cache.outputs.cache-hit != 'true'
        run: |
          python -c "import os, cmdstanpy; assert cmdstanpy.install_cmdstan(version=os.environ['CMDSTAN_VERSION'], cores=os.cpu_count() or 2, progress=False), 'install_cmdstan a échoué'"
      # Garde-fou : sans lui, une pile DRT absente ferait SAUTER tous les tests DRT et le
      # job resterait vert en ne vérifiant rien — exactement le défaut de la CI actuelle.
      - name: Check the DRT stack is really available
        run: |
          python -c "import drt.engine as e; ok, why = e.engine_available(); assert ok, why; print('Moteur drt/ OK')"
      # Toute la suite, pas une liste de fichiers : avec la pile DRT réelle, les tests qui
      # s'y SAUTENT ailleurs s'exécutent ici (test_cmdstan_version.py:215 « job CI drt »,
      # test_stan_compile.py, test_setup_drt.py, test_drt_failure_diagnostics.py, test_eis_tabs.py…).
      # Les tests HMC (test_drt_engine.py, test_pipeline.py : 7 cas DRT-1 + reproductibilité,
      # marqués slow, ~2-5 min par spectre sur 4 cœurs) sont inclus.
      - name: Run all tests (MAP + HMC, slow included)
        run: python -m pytest tests/ -v -rs

  # Suite RAPIDE sous Windows, cible réelle des utilisateurs (launch.bat) : chemins, encodages,
  # séparateurs. Sans CmdStan ni tests slow (HMC) : la DRT réelle reste couverte par le job `drt`.
  validate-windows:
    name: Suite rapide (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Compile all sources
        run: python -m compileall app.py setup_drt_bayesien.py core fits drt circuit plotting exports ui pages tests
      - name: Run fast tests
        run: python -m pytest tests/ -v -m "not slow" -rs
