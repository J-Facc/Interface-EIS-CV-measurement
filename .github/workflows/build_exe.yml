name: Build EIS_Analyzer.exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write        # ← correction de l'erreur principale

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # ← correction du warning Node.js

jobs:
  build:
    runs-on: windows-2025-vs2026             # ← adresse le notice windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build .exe
        run: |
          cd launcher
          pyinstaller --onefile --noconsole --name EIS_Analyzer --add-data "splash.py;." launcher.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EIS_Analyzer
          path: launcher/dist/EIS_Analyzer.exe
          retention-days: 7

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "EIS Analyzer — dernière version"
          body: |
            Build automatique — commit ${{ github.sha }}
            Date : ${{ github.event.head_commit.timestamp }}
          files: launcher/dist/EIS_Analyzer.exe
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
