# Paramètres physiques (électrochimie)
physics:
  T: 298.0          # K
  F: 96485.0        # C/mol
  R: 8.314          # J/mol/K
  n: 1              # électrons échangés
  C0: 0.02          # M — concentration médiateur Fe(CN)6
  D_FeIII: 7.2e-10  # m^2/s
  D_FeII: 6.5e-10   # m^2/s

# Géométrie microfluidique
geometry:
  xe: 30.0e-6       # m — largeur électrode WE
  h: 60.0e-6        # m — hauteur canal
  d: 300.0e-6       # m — largeur canal
  S_WE: 9.0e-9      # m^2 — surface active

# Conditions opératoires
conditions:
  Fv: 5.0e-10       # m^3/s (= 0.5 µL/s)

# Acquisition EIS — plage de balayage fréquentiel (fixe).
# Sert à reconstruire l'axe fréquence des exports EC-Lab qui ne contiennent
# que Re(Z)/-Im(Z) sans colonne fréquence (balayage log HF→BF).
acquisition:
  f_max_hz: 1.0e+6  # Hz — fréquence haute (début de balayage)
  f_min_hz: 0.1     # Hz — fréquence basse (fin de balayage)

# Paramètres de fit
fit:
  # Pondération UNIQUE du CNLS : structure d'erreur d'Orazem caractérisée par le
  # measurement model (core/measurement_model.py) sur les réplicats BRUTS de chaque
  # groupe, à chaque analyse — jamais relue d'un fichier. Sans réplicats en nombre
  # suffisant, l'analyse du groupe est ARRÊTÉE avec un message (AUDIT.md ERR-1).
  error_structure:
    min_replicates: 3          # nb minimal de réplicats pour caractériser σ(ω)
  n_freqs_parasites: [50.0, 100.0]
  tol_parasites: 3.0
  max_iter: 10000              # plafond d'évaluations par départ du fit Orazem
  n_monte_carlo: 1000
  # Circuit ajusté par le fit Orazem (fits/orazem_fit.py) — valeurs PAR DÉFAUT
  # proposées dans l'interface, où l'utilisateur les modifie. Syntaxe :
  # docs/CIRCUIT_UTILISATEUR.md. Ici : le Randles complet historique (ex-
  # fits/physics.py:Z_randles_full). Guess de départ = ordres de grandeur du capteur
  # de la thèse (le fit multi-départ les explore à ±0,5 décade) ; bornes LARGES,
  # basse 0 pour les éléments passifs et 0,3 ≤ alpha ≤ 1 (CPE). null = non borné.
  circuit:
    expression: "Re + parallel(Re_prime + parallel(R(Rct) + ZD_bounded(R_D, tau_d), Q(Qdl, alpha)), C(Cb))"
    target_param: Rct          # paramètre servant de signal de calibration
    parameters:
      Re:       {initial: 100.0,  lower: 0.0,    upper: 1.0e+5}
      Re_prime: {initial: 50.0,   lower: 0.0,    upper: 1.0e+5}
      Rct:      {initial: 1500.0, lower: 0.0,    upper: 1.0e+9}
      R_D:      {initial: 300.0,  lower: 0.0,    upper: 1.0e+7}
      tau_d:    {initial: 0.2,    lower: 1.0e-6, upper: 1.0e+4}
      Qdl:      {initial: 5.0e-6, lower: 0.0,    upper: 1.0e-2}
      alpha:    {initial: 0.8,    lower: 0.3,    upper: 1.0}
      Cb:       {initial: 3.0e-9, lower: 0.0,    upper: 1.0e-3}
  drt:
    # DRT (drt/engine.py) lancée par le pipeline sur CHAQUE réplicat brut ET sur la
    # moyenne de chaque groupe. mode 'optimize' (MAP, ~1 s/spectre, sans diagnostic
    # de convergence) ou 'sample' (HMC, 2 à 5 min/spectre, R-hat/ESS/divergences et
    # intervalles de crédibilité — drt/VALIDATION_REGLAGES.md). Un spectre peut être
    # recalculé en 'sample' à la demande depuis l'onglet DRT (core.pipeline.recompute_drt).
    enabled: true
    mode: optimize
  drt_wiener_W: 1.0e-8   # filtre Wiener (plus petit = résolution plus fine)
  drt_n_z: 10000          # points de la grille log-ω

# Export
export:
  dpi: 150
  fig_width: 1200
  fig_height: 800
