# Paramètres physiques (électrochimie)
physics:
  T: 298.0          # K
  F: 96485.0        # C/mol
  R: 8.314          # J/mol/K
  n: 1              # électrons échangés
  C0: 0.02          # M — concentration médiateur Fe(CN)6
  D_FeIII: 7.2e-10  # m^2/s
  D_FeII: 6.5e-10   # m^2/s

# Géométrie microfluidique
geometry:
  xe: 30.0e-6       # m — largeur électrode WE
  h: 60.0e-6        # m — hauteur canal
  d: 300.0e-6       # m — largeur canal
  S_WE: 9.0e-9      # m^2 — surface active

# Conditions opératoires
conditions:
  Fv: 5.0e-10       # m^3/s (= 0.5 µL/s)

# Acquisition EIS — plage de balayage fréquentiel (fixe).
# Sert à reconstruire l'axe fréquence des exports EC-Lab qui ne contiennent
# que Re(Z)/-Im(Z) sans colonne fréquence (balayage log HF→BF).
acquisition:
  f_max_hz: 1.0e+6  # Hz — fréquence haute (début de balayage)
  f_min_hz: 0.1     # Hz — fréquence basse (fin de balayage)

# Paramètres de fit
fit:
  # Pondération UNIQUE du CNLS : structure d'erreur d'Orazem & Tribollet
  # (measurement model). σ = α·|Z_re| + β·|Z_im| + γ·|Z|²/R_m + δ, poids = 1/σ².
  # Les coefficients (α,β,γ,δ) NE SONT PAS ici : ils sont caractérisés sur
  # réplicats (≥ 3) puis persistés dans persistence_path, et réutilisés pour les
  # spectres sans réplicats. Cf. fits/error_structure.py.
  error_structure:
    equal_re_im: true          # impose α = β (variances Re/Im égales — standard)
    voigt_based: false         # true => σ via résidus de Voigt (Lin-KK) par réplicat
    R_m: null                  # résistance de mesure (Ω) ; null => terme γ absorbé
    min_replicates: 3          # nb minimal de réplicats pour caractériser (lu aussi par
                               # core/measurement_model.py ; les autres clés de cette
                               # section ne servent qu'à l'ancien fits/error_structure.py)
    persistence_path: null     # null => config/error_structure.json
  n_freqs_parasites: [50.0, 100.0]
  tol_parasites: 3.0
  max_iter: 10000
  n_monte_carlo: 1000
  bounds_randles_full:
    Re:       [100.0,   100000.0]
    Re_prime: [1.0,     100000.0]
    Cb:       [1.0e-12, 1.0e-4]
    Rct:      [100.0,   1.0e+9]
    Qdl:      [1.0e-12, 1.0e-4]
    alpha:    [0.6,     1.0]
    R_D:      [10.0,    1.0e+6]
    tau_d:    [1.0e-4,  1.0e+3]
  drt:
    # Mode DRT (plugin bayes_drt2) : 'optimize' (MAP Stan, défaut pipeline) ou
    # 'sample' (HMC, à la demande). La grille τ est construite par bayes_drt2 depuis
    # les fréquences mesurées (pas de n_tau/tau_min/tau_max ici).
    mode: optimize
  drt_wiener_W: 1.0e-8   # filtre Wiener (plus petit = résolution plus fine)
  drt_n_z: 10000          # points de la grille log-ω

# Export
export:
  dpi: 150
  fig_width: 1200
  fig_height: 800
